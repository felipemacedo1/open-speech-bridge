[workspace]
resolver = "2"
members = [
    "crates/osb-core",
    "crates/osb-audio",
    "crates/osb-pipewire",
    "crates/osb-protocol",
    "crates/osb-daemon",
    "crates/osb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/user/open-speech-bridge"
homepage = "https://github.com/user/open-speech-bridge"
authors = ["OpenSpeechBridge Contributors"]
keywords = ["speech", "translation", "audio", "pipewire", "real-time"]
categories = ["multimedia::audio", "accessibility"]

[workspace.dependencies]
# Core
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Audio
ringbuf = "0.4"
rubato = "0.16"  # High-quality resampling

# PipeWire (Linux)
pipewire = "0.8"
libspa = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Metrics and diagnostics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Testing
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates
osb-core = { path = "crates/osb-core" }
osb-audio = { path = "crates/osb-audio" }
osb-pipewire = { path = "crates/osb-pipewire" }
osb-protocol = { path = "crates/osb-protocol" }
osb-daemon = { path = "crates/osb-daemon" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1  # Slight optimization for faster dev iteration

[profile.bench]
lto = "thin"
codegen-units = 1
