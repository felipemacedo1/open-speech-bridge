[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osb-engine-sdk"
version = "0.1.0"
description = "Python Engine SDK and local ML UDS workers for OpenSpeechBridge (OSBP v1)"
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1.0", "numpy>=1.26.0"]
kokoro = ["kokoro>=0.9.0", "torch>=2.4.0", "numpy>=1.26.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["osb_engine_sdk*"]
