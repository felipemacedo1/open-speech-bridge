[package]
name = "osb-engine-mock"
description = "Mock engine for testing OpenSpeechBridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
osb-protocol = { path = "../../crates/osb-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
